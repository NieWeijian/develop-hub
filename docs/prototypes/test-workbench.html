.th-wizard{max-width:900px;margin:auto}.th-steps{display:grid;gap:8px;margin:18px 0 22px}.th-steps.four{grid-template-columns:repeat(4,1fr)}.th-steps.six{grid-template-columns:repeat(6,1fr)}

.th-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.th-note{margin:14px 0 0;padding:12px;border-radius:8px;background:var(--th-orange-soft);color:var(--th-orange)}

.th-env{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;margin:14px 0;padding:14px;border-left:4px solid var(--th-green);background:var(--th-green-soft)}.th-env i{color:var(--th-green)}.th-env strong{display:block}.th-env small{display:block;margin-top:3px;color:var(--th-muted)}

.th-baseline{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-top:16px;padding:14px;border-left:4px solid var(--th-orange);background:var(--th-orange-soft)}.th-baseline.pass{border-left-color:var(--th-green);background:var(--th-green-soft)}.th-baseline strong{display:block}.th-baseline span{color:var(--th-muted);font-size:12px}
.th-detail-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.7fr);gap:16px}.th-status-list{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:0}.th-status-list dt{color:var(--th-muted)}.th-status-list dd{margin:0;overflow-wrap:anywhere}
.th-progress-line{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0}.th-progress-node{border-top:4px solid var(--th-line);padding-top:9px;color:var(--th-muted)}.th-progress-node.done{border-color:var(--th-green);color:var(--th-ink)}.th-progress-node.current{border-color:var(--th-orange);color:var(--th-orange)}
.th-points{margin-top:18px}.th-point{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--th-line)}.th-point input{margin-top:5px}.th-point strong{display:block}.th-point small{display:block;margin-top:3px;color:var(--th-muted)}

.th-case-group{margin-top:18px}.th-case-group h3{margin:0 0 6px}.th-case{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(150px,.5fr);gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--th-line)}.th-case strong{display:block}.th-case small{display:block;color:var(--th-muted);margin-top:2px}.th-case .th-input{min-height:34px}
.th-json{margin-top:14px;max-height:330px;overflow:auto}.th-receipt{max-width:760px;margin:50px auto;text-align:center}.th-receipt-icon{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 14px;border-radius:50%;background:var(--th-green-soft);color:var(--th-green)}.th-receipt-icon i{width:28px;height:28px}.th-receipt h1{margin:0 0 8px}.th-receipt>p{color:var(--th-muted)}
.th-boundary{margin:18px 0;padding:14px;border:1px dashed var(--th-orange);border-radius:9px;color:var(--th-orange);text-align:left}
@media(max-width:760px){.th-top{flex-wrap:wrap}.th-nav{order:3;width:100%;overflow:auto}.th-health{margin-left:auto}.th-main{padding:16px}.th-head{flex-direction:column}.th-product-grid,.th-grid,.th-fields,.th-choice-grid,.th-detail-top{grid-template-columns:1fr}.th-field.wide{grid-column:auto}.th-facts{grid-template-columns:1fr}.th-steps.six{grid-template-columns:repeat(2,1fr)}.th-steps.four{grid-template-columns:repeat(2,1fr)}.th-repo-row,.th-time-item{grid-template-columns:1fr}.th-case{grid-template-columns:26px 1fr}.th-case>:last-child{grid-column:2}.th-progress-line{grid-template-columns:1fr}.th-progress-node{border-top:0;border-left:4px solid var(--th-line);padding:7px 10px}}
</style>

function icon(n){return `<i data-lucide="${n}" aria-hidden="true"></i>`}

if(state.productStep===1){const repo=trackedRepos[state.appRepo]||trackedRepos[p.appRepo];return `<h2>核验 SDK 环境并绑定被测 Repo</h2><p>Manifest 用于确认当前 175 本地 SDK 是否是预期基线；产品只绑定一个应用仓库，不把 Kernel 或 U-Boot 当作测试对象。</p><div class="th-env">${icon('badge-check')}<div><strong>SDK 工作区可用 · repo sync 一致 · 无本地修改</strong><small>最近核验 ${p.syncedAt} · ${p.projects} 个 project · manifest commit ${p.manifestCommit}</small></div></div><div class="th-fields">${field('SDK 根目录',`<input class="th-input" value="${p.sdk}" readonly>`,'wide')}${field('Manifest 文件',`<input class="th-input" value="${p.manifestFile}" readonly>`)}${field('Manifest 分支 / Commit',`<input class="th-input" value="${p.manifestBranch} @ ${p.manifestCommit}" readonly>`)}</div><div class="th-manifest"><div><span>Kernel（固定基线）</span><code>${p.kernel}</code></div><div><span>U-Boot（固定基线）</span><code>${p.uboot}</code></div><div><span>RKBin（固定基线）</span><code>${p.rkbin}</code></div></div><h3 style="margin:20px 0 8px">绑定唯一被测应用 Repo</h3><div class="th-fields">${field('被测应用 Repo',`<select class="th-select" id="tracked-repo">${Object.entries(trackedRepos).map(([path,r])=>`<option value="${path}" ${path===state.appRepo?'selected':''}>${r.label} · ${path}</option>`).join('')}</select>`)}${field('Gerrit Project',`<input class="th-input" value="${repo.gerrit}" readonly>`)}${field('本地目录',`<input class="th-input" value="${p.sdk}/${state.appRepo}" readonly>`)}${field('Git 状态',`<input class="th-input" value="clean · ${repo.branch} · HEAD ${repo.head}" readonly>`)}</div><div class="th-note">Test Round 只会把该 Gerrit Project 的 Patchset checkout 到这个目录；其他 SDK 仓库不进入测试点列表。</div>`}
if(state.productStep===2)return `<h2>选择 Board Config 并验证基线</h2><p>用户选择板级配置，系统据此生成配置命令，再执行固定的 SDK 构建命令。</p><div class="th-fields">${field('Board config',`<select class="th-select" id="board"><option value="${p.board}" ${state.board===p.board?'selected':''}>${p.board}</option><option value="rmsl321_spi_nand_debug" ${state.board==='rmsl321_spi_nand_debug'?'selected':''}>rmsl321_spi_nand_debug</option></select>`)}${field('构建节点','<input class="th-input" value="175-local" readonly>')}${field('系统生成的配置命令',`<input class="th-input" value="./build.sh lunch ${state.board}" readonly>`)}${field('固定构建命令','<input class="th-input" value="./build.sh" readonly>')}</div><div class="th-baseline ${state.baselineBuilt?'pass':''}"><div><strong>${state.baselineBuilt?'基线构建通过':'尚未执行基线构建'}</strong><span>${state.baselineBuilt?'exit 0 · 18m 42s · 镜像目录已刷新':'保存产品前必须由 Server 完成一次固定构建'}</span></div>${button(state.baselineBuilt?'重新验证':'执行基线编译','run-baseline',state.baselineBuilt?'':'primary')}</div>${state.baselineBuilt?`<pre class="th-terminal">$ ./build.sh lunch ${state.board}\n$ ./build.sh\nBuild completed: exit_code=0\nArtifacts refreshed: oem.img, boot.img</pre>`:''}`;
return `<h2>固件产物与产品确认</h2><p>指定 Server 校验后的固件查找位置；后续 Test Round 只从这里登记本次刷新过的镜像。</p><div class="th-fields">${field('产品名称',`<input class="th-input" value="${p.name}">`)}${field('产品标识',`<input class="th-input" value="${state.sdk}" readonly>`)}${field('固件生成目录',`<input class="th-input" value="${p.artifact}">`,'wide')}${field('产物规则','<input class="th-input" value="oem.img, boot.img, uboot.img">','wide')}</div><div class="th-note">保存后形成基线：SDK + Manifest + Repo 目录 + Board Config + 基线构建证据 + Artifact Root。</div>`}
function productWizard(){return `${top('products')}<main class="th-main"><div class="th-wizard"><div class="th-head"><div><div class="th-kicker">Product baseline setup</div><h1>新建测试产品</h1></div>${button('取消','cancel-product','ghost')}</div>${steps(['标准 SDK','环境 / 被测 Repo','板级配置 / 基线','固件产物'],state.productStep,'four')}<section class="th-panel">${productStepBody()}<div class="th-actions">${button('上一步','product-back','',state.productStep===0)}${button(state.productStep===3?'保存测试产品':'下一步','product-next','primary',state.productStep===2&&!state.baselineBuilt)}</div></section></div></main>`}
function roundStepBody(){const p=products[state.selectedProduct];if(state.roundStep===0)return `<h2>查看产品测试时间线</h2><p>本轮从产品详情进入，产品和被测 Repo 已锁定；这里先确认历史进度，再选择下一个测试点。</p><div class="th-fields">${field('测试产品',`<input class="th-input" value="${p.name} · ${state.selectedProduct}" readonly>`)}${field('唯一被测 Repo',`<input class="th-input" value="${p.gerrit} · ${p.repoBranch}" readonly>`)}</div><div class="th-env">${icon('shield-check')}<div><strong>基线可用 · SDK build passed</strong><small>${p.manifestBranch} @ ${p.manifestCommit} · Board ${p.board}</small></div></div><div class="th-timeline"><div class="th-time-item done"><time>09-06 16:22</time><div><strong>产品基线验证通过</strong><small>SDK 环境、Board Config 与基线镜像已锁定</small></div><span class="th-tag">BASELINE</span></div><div class="th-time-item done"><time>09-07 11:08</time><div><strong>TEST-000039 · 18432 / PS5</strong><small>8 个基线用例、2 个场景用例全部通过</small></div><span class="th-tag">PASSED</span></div><div class="th-time-item done"><time>09-09 18:41</time><div><strong>TEST-000041 · 18432 / PS6</strong><small>3 passed · 1 pending，记录已归档</small></div><span class="th-tag warn">PARTIAL</span></div><div class="th-time-item current"><time>现在</time><div><strong>18432 / PS7 可测试</strong><small>Gerrit 新 Patchset 已就绪，尚未创建 Test Round</small></div><span class="th-tag warn">NEXT</span></div><div class="th-time-item"><time>排队中</time><div><strong>18455 / PS1 等待依赖</strong><small>依赖提交未 ready，暂不可选择</small></div><span class="th-tag warn">BLOCKED</span></div></div>`;
if(state.roundStep===1)return `<h2>选择 ${p.name} 的可测试点</h2><p>以下提交全部来自唯一绑定的 Gerrit Project <code>${p.gerrit}</code>；不会混入 Kernel、U-Boot 或其他应用仓库。</p><div class="th-points">${gerritPoints.map(x=>`<label class="th-point"><input type="radio" name="point" value="${x.id}" ${state.point===x.id?'checked':''} ${x.status!=='可测试'?'disabled':''}><span><strong>${x.subject}</strong><small>${p.gerrit} · ${x.branch} · owner ${x.owner}</small></span><span class="th-tag ${x.status==='可测试'?'':'warn'}">${x.id} · ${x.status}</span></label>`).join('')}</div>`;
if(state.roundStep===2){const x=gerritPoints.find(v=>v.id===state.point);return `<h2>同步提交、创建分支并编译</h2><p>Server 只把精确 Patchset checkout 到本产品唯一的被测应用 Repo，并为本轮创建隔离分支。</p><dl class="th-status-list"><dt>Gerrit Project</dt><dd><code>${p.gerrit}</code></dd><dt>Target Repo</dt><dd><code>${p.sdk}/${p.appRepo}</code></dd><dt>Gerrit Ref</dt><dd><code>refs/changes/32/${x.id.replace('/','/')}</code></dd><dt>任务分支</dt><dd><code>test/round-000042-change-${x.id.replace('/','-ps')}</code></dd><dt>构建命令</dt><dd><code>./build.sh</code></dd></dl><pre class="th-terminal">$ cd ${p.sdk}/${p.appRepo}\n$ git fetch gerrit refs/changes/32/${x.id}\n$ git checkout -b test/round-000042-change-${x.id.replace('/','-ps')} FETCH_HEAD\nHEAD = e2bd02b5\n$ cd ${p.sdk} && ./build.sh\nBuild completed: exit_code=0</pre>`}
if(state.roundStep===3)return `<h2>确认镜像并选择在线测试台</h2><p>只登记本轮编译后刷新、且位于产品 Artifact Root 内的镜像。</p><div class="th-fields">${field('Artifact Root',`<input class="th-input" value="${p.artifact}" readonly>`,'wide')}${field('镜像','<select class="th-select"><option>oem.img · 82.4 MiB</option><option>boot.img · 31.8 MiB</option></select>')}${field('在线测试台',`<select class="th-select" id="bench"><option value="3588-qa-01">3588-qa-01 · RMSL321 online</option><option value="3588-qa-02">3588-qa-02 · idle</option></select>`)}${field('镜像 SHA-256','<input class="th-input" value="2ad4c019…91ce" readonly>')}${field('SSH 状态','<input class="th-input" value="Connected · host key verified" readonly>')}</div>`;
if(state.roundStep===4)return `<h2>选择 Test Case 与参数</h2><p>基线功能测试默认全选，用于确认提交没有破坏既有能力；Corner Case 按需选择。</p>${['baseline','corner'].map(group=>`<section class="th-case-group"><h3>${group==='baseline'?'基线功能测试':'场景 Corner Case'}</h3><div>${cases.filter(c=>c.group===group).map(c=>`<label class="th-case"><input type="checkbox" data-case="${c.id}" ${c.checked?'checked':''} ${group==='baseline'?'data-baseline="true"':''}><span><strong>${c.name}</strong><small>${c.desc}</small></span><input class="th-input" data-param="${c.id}" value="${c.param}" aria-label="${c.name} 参数"></label>`).join('')}</div></section>`).join('')}`;
const selected=cases.filter(c=>c.checked);const config={schema_version:'1.0',round_id:'TEST-000042',product:state.selectedProduct,baseline:{sdk:p.sdk,manifest:{branch:p.manifestBranch,commit:p.manifestCommit},board:p.board},source:{type:'gerrit',project:p.gerrit,repo_path:p.appRepo,change:18432,patchset:7,commit:'e2bd02b5'},build:{command:'./build.sh',exit_code:0},artifacts:[{partition:'oem',file:'oem.img',sha256:'2ad4c019…91ce'}],target:{node:state.bench,remote_path:'/home/linaro/develop-hub-qa/jobs/TEST-000042'},cases:selected.map(c=>({id:c.id,params:c.param}))};return `<h2>确认命令并生成配置</h2><p>JSON 与测试镜像一起传输到测试台；本轮到“远端就绪”结束，不在此处启动烧录或测试。</p><div class="th-grid"><dl class="th-status-list"><dt>产品 / Repo</dt><dd>${state.selectedProduct}<br><code>${p.gerrit}</code></dd><dt>Patchset</dt><dd>18432 / PS7</dd><dt>基线</dt><dd>${p.manifestCommit} · ${p.board}</dd><dt>构建</dt><dd>exit 0</dd><dt>镜像</dt><dd>oem.img · SHA-256 verified</dd><dt>测试台</dt><dd>${state.bench}</dd><dt>Test Cases</dt><dd>${selected.length} selected</dd></dl><pre class="th-terminal th-json"><code>${JSON.stringify(config,null,2)}</code></pre></div><div class="th-note">远端落点：<code>/home/linaro/develop-hub-qa/jobs/TEST-000042/</code>，包含 test-run.json、firmware/ 与后续 evidence/ 目录。</div>`}
function roundWizard(){return `${top('rounds')}<main class="th-main"><div class="th-wizard"><div class="th-head"><div><div class="th-kicker">New test round</div><h1>新建 Test Round</h1></div>${button('取消','cancel-round','ghost')}</div>${steps(['产品现状','测试点','同步 / 编译','镜像 / 测试台','Test Cases','确认 / 推送'],state.roundStep,'six')}<section class="th-panel">${roundStepBody()}<div class="th-actions">${button('上一步','round-back')}${button(state.roundStep===5?'生成 JSON 并推送':'下一步','round-next','primary')}</div></section></div></main>`}

function render(){root.innerHTML=state.view==='products'?productsView():state.view==='product-detail'?productDetail():state.view==='product-wizard'?productWizard():state.view==='round-wizard'?roundWizard():state.view==='rounds'?roundsView():receipt();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});bind()}
function bind(){root.querySelectorAll('[data-home]').forEach(x=>x.addEventListener('click',()=>{state.view=x.dataset.home;render()}));root.querySelector('#new-product')?.addEventListener('click',()=>{const p=products[state.sdk];state.productStep=0;state.appRepo=p.appRepo;state.board=p.board;state.baselineBuilt=false;state.view='product-wizard';render()});root.querySelectorAll('[data-product]').forEach(x=>x.addEventListener('click',()=>{state.selectedProduct=x.dataset.product;state.view='product-detail';render()}));root.querySelector('#back-products')?.addEventListener('click',()=>{state.view='products';render()});root.querySelector('#edit-product')?.addEventListener('click',()=>{const p=products[state.selectedProduct];state.sdk=state.selectedProduct;state.appRepo=p.appRepo;state.board=p.board;state.productStep=0;state.baselineBuilt=true;state.view='product-wizard';render()});root.querySelectorAll('#new-round').forEach(x=>x.addEventListener('click',()=>{state.roundStep=0;state.view='round-wizard';render()}));root.querySelector('#cancel-product')?.addEventListener('click',()=>{state.view='products';render()});root.querySelector('#product-back')?.addEventListener('click',()=>{if(state.productStep>0){state.productStep--;render()}});root.querySelector('#product-next')?.addEventListener('click',()=>{if(state.productStep===2&&!state.baselineBuilt)return;if(state.productStep<3){state.productStep++;render()}else{const p=products[state.sdk];const r=trackedRepos[state.appRepo];p.appRepo=state.appRepo;p.gerrit=r.gerrit;p.repoBranch=r.branch;p.repoHead=r.head;p.board=state.board;state.selectedProduct=state.sdk;state.view='product-detail';render()}});root.querySelectorAll('[name="sdk"]').forEach(x=>x.addEventListener('change',()=>{const p=products[x.value];state.sdk=x.value;state.appRepo=p.appRepo;state.board=p.board;state.baselineBuilt=false;render()}));root.querySelector('#tracked-repo')?.addEventListener('change',e=>{state.appRepo=e.target.value;state.baselineBuilt=false;render()});root.querySelector('#board')?.addEventListener('change',e=>{state.board=e.target.value;state.baselineBuilt=false;render()});root.querySelector('#run-baseline')?.addEventListener('click',()=>{state.baselineBuilt=true;render()});root.querySelector('#cancel-round')?.addEventListener('click',()=>{state.view='product-detail';render()});root.querySelectorAll('[name="point"]').forEach(x=>x.addEventListener('change',()=>{state.point=x.value;render()}));root.querySelector('#bench')?.addEventListener('change',e=>state.bench=e.target.value);root.querySelectorAll('[data-case]').forEach(x=>x.addEventListener('change',()=>{const c=cases.find(v=>v.id===x.dataset.case);c.checked=x.checked}));root.querySelectorAll('[data-param]').forEach(x=>x.addEventListener('change',()=>{const c=cases.find(v=>v.id===x.dataset.param);c.param=x.value}));root.querySelector('#round-back')?.addEventListener('click',()=>{if(state.roundStep>0){state.roundStep--;render()}else{state.view='product-detail';render()}});root.querySelector('#round-next')?.addEventListener('click',()=>{if(state.roundStep<5){state.roundStep++;render()}else{state.view='receipt';render()}});root.querySelector('#receipt-back')?.addEventListener('click',()=>{state.view='rounds';render()})}
